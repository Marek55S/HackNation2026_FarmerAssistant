# Local run without installing Node/pnpm on the host.
#   docker compose up dev          → http://localhost:3000 (hot reload, edits in ./src apply immediately)
#   docker compose up --build prod → http://localhost:8080 (same image as Cloud Run; PWA + offline work)
# Backend: run it separately (backend/compose.yaml or uvicorn) on host port 8000 – reached via host.docker.internal.
services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Dependencies and build cache stay inside the container, not in the project folder.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Keep the pnpm package store inside the node_modules volume (not in the project folder).
      npm_config_store_dir: /app/node_modules/.pnpm-store
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prod:
    build: .
    ports:
      - "8080:8080"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
  next_cache:
